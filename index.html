<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Keuangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <div class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- Header / Main Tabs -->
        <div class="bg-white rounded-xl shadow-sm p-2 flex border border-gray-200">
            <button id="tabExpense" onclick="actions.switchTab('EXPENSE')" class="flex-1 py-3 px-4 text-center font-medium rounded-lg transition-all">
                <i class="fa-solid fa-arrow-up-from-bracket mr-2"></i> Pengeluaran
            </button>
            <button id="tabIncome" onclick="actions.switchTab('INCOME')" class="flex-1 py-3 px-4 text-center font-medium rounded-lg transition-all">
                <i class="fa-solid fa-arrow-down-to-bracket mr-2"></i> Pemasukan
            </button>
        </div>

        <!-- Form Input & Edit Transaksi -->
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-200">
            <h2 class="text-lg font-bold mb-4 text-gray-700 flex items-center justify-between">
                <span id="formTitleText">Tambah Pengeluaran</span>
                <button id="cancelEditBtn" onclick="actions.cancelEdit()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded-md transition">
                    Batal Edit
                </button>
            </h2>

            <form id="txForm" onsubmit="actions.handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Jumlah (Nominal) -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Jumlah (Rp)</label>
                        <input type="number" id="txAmount" onkeydown="utils.preventInvalidNumberInput(event)" oninput="actions.updateFormField('amount', this.value)" required placeholder="0" min="1" max="9007199254740991" step="1" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Dompet -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Dompet</label>
                        <select id="txWallet" onchange="actions.updateFormField('walletId', this.value)" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        </select>
                    </div>

                    <!-- Kategori -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kategori</label>
                        <select id="txCategory" onchange="actions.updateFormField('categoryId', this.value)" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        </select>
                    </div>

                    <!-- Tanggal & Jam -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Tanggal</label>
                            <input type="date" id="txDate" onchange="actions.updateFormField('date', this.value)" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Jam</label>
                            <input type="time" id="txTime" onchange="actions.updateFormField('time', this.value)" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- Catatan / Keterangan -->
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Catatan (Opsional)</label>
                    <input type="text" id="txNote" oninput="actions.updateFormField('note', this.value)" maxlength="255" placeholder="Misal: Makan Siang, Gaji Bulanan..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors shadow-sm">
                    Simpan Transaksi
                </button>
            </form>
        </div>

        <!-- Section Ringkasan & Filter -->
        <div class="bg-white rounded-xl shadow-sm p-5 border border-gray-200 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-gray-100">
                <div>
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Terfilter</span>
                    <h3 id="totalFilteredAmount" class="text-2xl font-extrabold text-gray-800">Rp 0</h3>
                </div>
                
                <!-- Filter Periode -->
                <div class="flex items-center gap-2">
                    <select id="filterPeriod" onchange="actions.updateFilter('period', this.value)" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="ALL">Semua Waktu</option>
                        <option value="TODAY">Hari Ini</option>
                        <option value="THIS_MONTH">Bulan Ini</option>
                        <option value="CUSTOM">Kustom Tanggal</option>
                    </select>
                </div>
            </div>

            <!-- Custom Date Range Filter -->
            <div id="customDateRange" class="hidden grid-cols-2 gap-3 pt-1">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Dari Tanggal</label>
                    <input type="date" id="filterStartDate" onchange="actions.updateFilter('startDate', this.value)" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Sampai Tanggal</label>
                    <input type="date" id="filterEndDate" onchange="actions.updateFilter('endDate', this.value)" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:outline-none">
                </div>
            </div>

            <!-- Filter Kategori & Dompet -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Filter Kategori</label>
                    <select id="filterCategory" onchange="actions.updateFilter('category', this.value)" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Filter Dompet</label>
                    <select id="filterWallet" onchange="actions.updateFilter('wallet', this.value)" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    </select>
                </div>
            </div>
        </div>

        <!-- Daftar Transaksi -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
                <h3 class="font-bold text-gray-700">Daftar Transaksi</h3>
                <span id="txCountBadge" class="text-xs bg-gray-200 text-gray-700 px-2.5 py-1 rounded-full font-medium">0 transaksi</span>
            </div>

            <div class="divide-y divide-gray-100" id="txList">
                <!-- Dipopulasi oleh render Engine -->
            </div>
        </div>

    </div>

    <!-- Script Aplikasi Architecture Refactored -->
    <script>
        // --- CONSTANTS ---
        const CATEGORIES = {
            EXPENSE: [
                { id: 'exp_food', name: 'Makanan & Minuman' },
                { id: 'exp_transport', name: 'Transportasi' },
                { id: 'exp_bills', name: 'Tagihan & Utilitas' },
                { id: 'exp_shopping', name: 'Belanja' },
                { id: 'exp_entertainment', name: 'Hiburan' },
                { id: 'exp_other', name: 'Lain-lain' }
            ],
            INCOME: [
                { id: 'inc_salary', name: 'Gaji' },
                { id: 'inc_freelance', name: 'Freelance' },
                { id: 'inc_investment', name: 'Investasi' },
                { id: 'inc_gift', name: 'Hadiah / Bonus' },
                { id: 'inc_other', name: 'Lain-lain' }
            ]
        };

        const WALLETS = [
            { id: 'w_cash', name: 'Uang Tunai (Cash)' },
            { id: 'w_bank', name: 'Rekening Bank' },
            { id: 'w_ewallet', name: 'E-Wallet (GoPay/OVO/Dana)' }
        ];

        // --- SINGLE SOURCE OF TRUTH (STATE) ---
        const state = {
            tab: 'EXPENSE',
            editingId: null,
            formData: {
                amount: '',
                walletId: '',
                categoryId: '',
                date: '',
                time: '',
                note: ''
            },
            filters: {
                period: 'THIS_MONTH',
                category: 'ALL',
                wallet: 'ALL',
                startDate: '',
                endDate: ''
            },
            transactions: []
        };

        // --- STORAGE ENGINE ---
        const storage = {
            save() {
                try {
                    localStorage.setItem('my_transactions', JSON.stringify(state.transactions));
                } catch (e) {
                    console.error("Gagal menyimpan ke LocalStorage:", e);
                }
            },
            load() {
                try {
                    const data = localStorage.getItem('my_transactions');
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    console.error("Gagal membaca LocalStorage:", e);
                    return [];
                }
            }
        };

        // --- ACTIONS ---
        const actions = {
            init() {
                state.transactions = storage.load();
                this.resetFormInput();
                renderApp();
            },
            
            switchTab(tabGroup) {
                state.editingId = null;
                state.tab = tabGroup;
                state.filters.category = 'ALL';
                state.filters.wallet = 'ALL';
                this.resetFormInput();
                renderApp();
            },

            updateFormField(field, value) {
                state.formData[field] = value;
            },

            updateFilter(field, value) {
                state.filters[field] = value;
                renderApp();
            },

            handleFormSubmit(e) {
                e.preventDefault();
                const amountVal = parseFloat(state.formData.amount);
                
                if (isNaN(amountVal) || amountVal <= 0 || amountVal > Number.MAX_SAFE_INTEGER) {
                    alert("Masukkan nominal angka yang valid!");
                    return;
                }

                const dateStr = state.formData.date;
                const timeStr = state.formData.time;
                const timestamp = utils.parseTimestamp(dateStr, timeStr) || Date.now();

                const txData = {
                    type: state.tab,
                    amount: Math.round(amountVal),
                    walletId: state.formData.walletId,
                    categoryId: state.formData.categoryId,
                    date: dateStr,
                    time: timeStr,
                    timestamp: timestamp,
                    note: (state.formData.note || '').trim()
                };

                if (state.editingId) {
                    state.transactions = state.transactions.map(t => t.id === state.editingId ? { ...txData, id: t.id } : t);
                    state.editingId = null;
                } else {
                    const newTx = { ...txData, id: 'tx_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6) };
                    state.transactions.push(newTx);
                }

                // Pengurutan berdasarkan timestamp, dengan fallback ke ID untuk urutan yang konsisten
                state.transactions.sort((a, b) => b.timestamp - a.timestamp || b.id.localeCompare(a.id));
                storage.save();
                this.resetFormInput();
                renderApp();
            },

            startEdit(id) {
                const tx = state.transactions.find(t => t.id === id);
                if (!tx) return;

                state.editingId = tx.id;
                state.tab = tx.type;

                state.formData = {
                    amount: tx.amount,
                    walletId: tx.walletId,
                    categoryId: tx.categoryId,
                    date: tx.date,
                    time: tx.time,
                    note: tx.note || ''
                };

                renderApp();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            cancelEdit() {
                state.editingId = null;
                this.resetFormInput();
                renderApp();
            },

            deleteTx(id) {
                if (confirm("Apakah Anda yakin ingin menghapus transaksi ini?")) {
                    if (state.editingId === id) {
                        state.editingId = null;
                        this.resetFormInput();
                    }
                    state.transactions = state.transactions.filter(t => t.id !== id);
                    storage.save();
                    renderApp();
                }
            },

            resetFormInput() {
                const now = new Date();
                state.formData = {
                    amount: '',
                    walletId: WALLETS[0].id,
                    categoryId: CATEGORIES[state.tab][0].id,
                    date: utils.formatDateISO(now),
                    time: utils.formatTimeISO(now),
                    note: ''
                };
            }
        };

        // --- UTILITIES ---
        const utils = {
            formatDateISO(d) {
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            },
            formatTimeISO(d) {
                return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
            },
            parseTimestamp(dateStr, timeStr, isEndOfDay = false) {
                if (!dateStr) return null;
                
                // Menggunakan penanganan tanggal ISO universal
                const parts = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                if (!parts) return null;
                
                const y = parseInt(parts[1], 10);
                const m = parseInt(parts[2], 10);
                const d = parseInt(parts[3], 10);

                if (isEndOfDay) {
                    return new Date(y, m - 1, d, 23, 59, 59, 999).getTime();
                }
                
                const timeParts = (timeStr || '00:00').split(':').map(Number);
                const hh = timeParts[0] || 0;
                const mm = timeParts[1] || 0;
                return new Date(y, m - 1, d, hh, mm, 0, 0).getTime();
            },
            preventInvalidNumberInput(e) {
                // Mencegah input karakter non-angka seperti e, E, +, -
                if (['e', 'E', '+', '-'].includes(e.key)) {
                    e.preventDefault();
                }
            },
            formatRupiah(amount) {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
            },
            escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
            }
        };

        // --- FILTER ENGINE ---
        function getFilteredData() {
            const now = new Date();
            const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0).getTime();
            const endToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999).getTime();
            const startMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0).getTime();
            const endMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999).getTime();

            return state.transactions.filter(tx => {
                if (tx.type !== state.tab) return false;
                if (state.filters.category !== 'ALL' && tx.categoryId !== state.filters.category) return false;
                if (state.filters.wallet !== 'ALL' && tx.walletId !== state.filters.wallet) return false;

                if (state.filters.period === 'TODAY') {
                    if (tx.timestamp < startToday || tx.timestamp > endToday) return false;
                } else if (state.filters.period === 'THIS_MONTH') {
                    if (tx.timestamp < startMonth || tx.timestamp > endMonth) return false;
                } else if (state.filters.period === 'CUSTOM') {
                    if (state.filters.startDate) {
                        const startTs = utils.parseTimestamp(state.filters.startDate, '00:00', false);
                        if (startTs && tx.timestamp < startTs) return false;
                    }
                    if (state.filters.endDate) {
                        const endTs = utils.parseTimestamp(state.filters.endDate, '23:59', true);
                        if (endTs && tx.timestamp > endTs) return false;
                    }
                }
                return true;
            });
        }

        // --- DECLARATIVE RENDER ENGINE ---
        function renderApp() {
            // 1. Render Tabs Header
            const btnExpense = document.getElementById('tabExpense');
            const btnIncome = document.getElementById('tabIncome');
            if (state.tab === 'EXPENSE') {
                btnExpense.className = "flex-1 py-3 px-4 text-center font-medium rounded-lg transition-all bg-red-500 text-white shadow-sm";
                btnIncome.className = "flex-1 py-3 px-4 text-center font-medium rounded-lg transition-all text-gray-600 hover:bg-gray-50";
            } else {
                btnIncome.className = "flex-1 py-3 px-4 text-center font-medium rounded-lg transition-all bg-green-600 text-white shadow-sm";
                btnExpense.className = "flex-1 py-3 px-4 text-center font-medium rounded-lg transition-all text-gray-600 hover:bg-gray-50";
            }

            // 2. Render Form Title & Button State
            const isEditing = Boolean(state.editingId);
            document.getElementById('formTitleText').innerText = (isEditing ? "Edit " : "Tambah ") + (state.tab === 'EXPENSE' ? 'Pengeluaran' : 'Pemasukan');
            document.getElementById('submitBtn').innerText = isEditing ? "Simpan Perubahan" : "Simpan Transaksi";
            document.getElementById('cancelEditBtn').classList.toggle('hidden', !isEditing);

            // 3. Populate Form Select Dropdowns & Sync Form Values
            const formCatSelect = document.getElementById('txCategory');
            const formWalSelect = document.getElementById('txWallet');
            const cats = CATEGORIES[state.tab];
            
            formCatSelect.innerHTML = cats.map(c => `<option value="${c.id}">${utils.escapeHtml(c.name)}</option>`).join('');
            formWalSelect.innerHTML = WALLETS.map(w => `<option value="${w.id}">${utils.escapeHtml(w.name)}</option>`).join('');

            // Synchronization dari state ke DOM input
            document.getElementById('txAmount').value = state.formData.amount;
            document.getElementById('txDate').value = state.formData.date;
            document.getElementById('txTime').value = state.formData.time;
            document.getElementById('txNote').value = state.formData.note;

            const selectedCat = cats.some(c => c.id === state.formData.categoryId) ? state.formData.categoryId : cats[0].id;
            const selectedWal = WALLETS.some(w => w.id === state.formData.walletId) ? state.formData.walletId : WALLETS[0].id;
            
            formCatSelect.value = selectedCat;
            formWalSelect.value = selectedWal;
            state.formData.categoryId = selectedCat;
            state.formData.walletId = selectedWal;

            // 4. Populate Filter Select Dropdowns & Sync Filter Values
            const filterCatSelect = document.getElementById('filterCategory');
            const filterWalSelect = document.getElementById('filterWallet');
            
            filterCatSelect.innerHTML = `<option value="ALL">Semua Kategori</option>` + 
                cats.map(c => `<option value="${c.id}">${utils.escapeHtml(c.name)}</option>`).join('');
            filterWalSelect.innerHTML = `<option value="ALL">Semua Dompet</option>` + 
                WALLETS.map(w => `<option value="${w.id}">${utils.escapeHtml(w.name)}</option>`).join('');

            document.getElementById('filterPeriod').value = state.filters.period;
            document.getElementById('filterStartDate').value = state.filters.startDate;
            document.getElementById('filterEndDate').value = state.filters.endDate;
            
            if (cats.some(c => c.id === state.filters.category) || state.filters.category === 'ALL') {
                filterCatSelect.value = state.filters.category;
            } else {
                state.filters.category = 'ALL';
                filterCatSelect.value = 'ALL';
            }

            filterWalSelect.value = state.filters.wallet;

            // Custom Date Toggle UI
            const customRangeDiv = document.getElementById('customDateRange');
            if (state.filters.period === 'CUSTOM') {
                customRangeDiv.classList.remove('hidden');
                customRangeDiv.classList.add('grid');
            } else {
                customRangeDiv.classList.add('hidden');
                customRangeDiv.classList.remove('grid');
            }

            // 5. Render Filtered List & Total
            const filteredList = getFilteredData();
            renderList(filteredList);
            
            const total = filteredList.reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
            const totalElement = document.getElementById('totalFilteredAmount');
            totalElement.innerText = utils.formatRupiah(total);
            totalElement.className = `text-2xl font-extrabold ${state.tab === 'EXPENSE' ? 'text-red-600' : 'text-green-600'}`;
        }

        function renderList(list) {
            const container = document.getElementById('txList');
            document.getElementById('txCountBadge').innerText = `${list.length} transaksi`;

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-gray-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-2"></i>
                        <p class="text-sm">Belum ada transaksi recorded...</p>
                    </div>`;
                return;
            }

            const allCats = [...CATEGORIES.EXPENSE, ...CATEGORIES.INCOME];
            container.innerHTML = list.map(tx => {
                const categoryObj = allCats.find(c => c.id === tx.categoryId) || { name: 'Umum' };
                const walletObj = WALLETS.find(w => w.id === tx.walletId) || { name: '-' };
                const isExpense = tx.type === 'EXPENSE';

                return `
                    <div class="p-4 flex items-center justify-between hover:bg-gray-50 transition-colors">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${isExpense ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                                <i class="fa-solid ${isExpense ? 'fa-arrow-up' : 'fa-arrow-down'}"></i>
                            </div>
                            <div>
                                <h4 class="font-semibold text-gray-800 text-sm">${utils.escapeHtml(categoryObj.name)}</h4>
                                <div class="flex items-center gap-2 text-xs text-gray-500 mt-0.5">
                                    <span><i class="fa-regular fa-clock mr-1"></i>${utils.escapeHtml(tx.date)} ${utils.escapeHtml(tx.time)}</span>
                                    <span>•</span>
                                    <span class="bg-gray-100 px-2 py-0.5 rounded text-gray-600">${utils.escapeHtml(walletObj.name)}</span>
                                </div>
                                ${tx.note ? `<p class="text-xs text-gray-500 italic mt-1">"${utils.escapeHtml(tx.note)}"</p>` : ''}
                            </div>
                        </div>

                        <div class="flex items-center space-x-3">
                            <span class="font-bold text-sm ${isExpense ? 'text-red-600' : 'text-green-600'}">
                                ${isExpense ? '-' : '+'} ${utils.formatRupiah(tx.amount)}
                            </span>
                            <div class="flex items-center space-x-1">
                                <button onclick="actions.startEdit('${tx.id}')" class="p-1.5 text-gray-400 hover:text-blue-600 transition" title="Edit">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button onclick="actions.deleteTx('${tx.id}')" class="p-1.5 text-gray-400 hover:text-red-600 transition" title="Hapus">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        // --- APP INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            actions.init();
        });
    </script>
</body>
</html>
